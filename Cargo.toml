[package]
name = "php2shell-checker"
version = "1.0.0"
edition = "2021"
description = "Authorized php2shell checker and lab PoC for homelab use"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2"

[[bin]]
name = "php2shell-checker"
path = "src/main.rs"

[[bin]]
name = "php2shell-poc"
path = "src/bin/poc.rs"
